plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def targetMcVersion = project.hasProperty('target_mc_version')
        ? project.property('target_mc_version').toString()
        : (project.hasProperty('mc262') ? '26.2' : project.minecraft_version.toString())
def targetFabricApiVersion = targetMcVersion == '26.2'
        ? project.fabric_api_version_26_2.toString()
        : project.fabric_api_version.toString()

version = targetMcVersion == project.minecraft_version.toString()
        ? project.mod_version
        : "${project.mod_version}-mc${targetMcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMcVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", targetMcVersion

    filesMatching("fabric.mod.json") {
        expand(
                "version": inputs.properties.version,
                "minecraft_version": inputs.properties.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    if (file("LICENSE").exists()) {
        from("LICENSE") {
            rename { "${it}_${projectName}" }
        }
    }
}
